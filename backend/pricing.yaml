# =============================================================================
# LLM pricing table  —  POINT-IN-TIME SNAPSHOT (see README §"Cost tracking").
#
# Prices are USD per 1,000 tokens (= the provider's per-1M price / 1000).
# Standard tier, shortest-prompt tier, no batch / cache-read discounts. Provider
# list prices drift and this file is NOT auto-updated from any provider API — it
# is a static, versioned approximation loaded once at startup. Bump `version`
# whenever you edit numbers; every request row records the version it was
# costed against.
#
# Version 2026-11-23: current models checked against the official pricing pages
# (developers.openai.com/api/docs/pricing, platform.claude.com/docs/en/about-claude/pricing,
# aistudio.google.com/docs/pricing) on 2026-11-23. Scheduled changes known on
# that date are noted inline — re-check after them.
#
# Older models are kept under "legacy" so historical rows and existing
# deployments still match a price. Entries flagged `estimated: true` have no
# confirmed public list price.
# =============================================================================
version: "2026-11-23"
